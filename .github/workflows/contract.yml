name: Smart Contract CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Cache Midnight Wallet State
        uses: actions/cache@v4
        with:
          path: .midnight-wallet-state
          key: ${{ runner.os }}-midnight-wallet-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-midnight-wallet-
            
