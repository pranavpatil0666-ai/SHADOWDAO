version: '3.8'

services:
  node:
    image: ghcr.io/midnight-ntwrk/midnight-node:latest
    ports:
      - "9944:9944"
    environment:
      - NETWORK=devnet

  indexer:
    image: ghcr.io/midnight-ntwrk/midnight-indexer:latest
    ports:
      - "8088:8088"
    depends_on:
      - node

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
